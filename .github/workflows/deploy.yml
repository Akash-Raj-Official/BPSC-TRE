name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows the workflow to be run manually from the Actions tab.
  workflow_dispatch:

# Least-privilege token scoped to what Pages deployment needs.
permissions:
  contents: read
  administration: write
  pages: write
  id-token: write

# Never run two deployments at once; queue instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate the question bank
        run: npm run validate:questions

      - name: Run tests
        run: npm test

      - name: Build
        # The repository name is read from the workflow context, so nothing in
        # the source has to be edited when the repo is renamed or forked.
        # A user/organisation site (<user>.github.io) is served from the domain
        # root, so it keeps the default base of "/".
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${{ github.event.repository.name }}/"
          fi
          echo "Building with base path: $VITE_BASE_PATH"
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
